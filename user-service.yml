    username: postgres
    password: 12345678

  jpa:
    hibernate:
      ddl-auto: update

jwt:
  secretkey: qwertyuiopqwertyuiuopolkjhgfdsarthgvrehgbeuythgvbthgyebitugbtgbiugbivuhbngiuhgbuhbgibg

logging:
  level:
    org.springframework.web: DEBUG
